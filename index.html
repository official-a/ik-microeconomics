<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Микроэкономика - 2 курс</title>

    <style>

        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

        body{background:radial-gradient(circle at top,#0a0a0a,#000);color:#f5f5f5;padding:20px;min-height:100vh;}

        .container{max-width:1100px;margin:0 auto;background:rgba(10,10,10,0.95);border-radius:12px;border:1px solid #1b1b1b;box-shadow:0 0 30px rgba(255,215,0,0.2);overflow:hidden;}

        header{background:linear-gradient(to right,#000,#1a1a1a);color:#f6d300;padding:35px;text-align:center;border-bottom:4px solid #f6d300;}

        h1{font-size:2.6rem;letter-spacing:1px;}

        .subtitle{font-size:1.25rem;opacity:0.9;margin-top:8px;}

        .test-mode{text-align:center;padding:15px;}

        .mode-btn{margin:5px;padding:12px 24px;background:#333;color:#f6d300;border:1px solid #444;border-radius:6px;cursor:pointer;font-weight:bold;}

        .mode-btn.active{background:#f6d300;color:#000;}

        .stats{display:flex;justify-content:space-around;background:#111;padding:15px;color:#f6d300;font-size:1.1rem;border-bottom:2px solid #222;}

        .stats span{color:#fff;font-weight:bold;}

        .quiz-container{padding:25px;}

        .question{background:#0f0f0f;border-left:5px solid #f6d300;padding:20px;margin-bottom:25px;border-radius:8px;box-shadow:0 0 15px rgba(255,215,0,0.1);}

        .question-number{color:#f6d300;font-size:1.35rem;font-weight:bold;margin-bottom:12px;}

        .question-text{font-size:1.22rem;margin-bottom:22px;color:#e6e6e6;}

        .options{display:grid;grid-template-columns:1fr 1fr;gap:15px;}

        @media(max-width:768px){.options{grid-template-columns:1fr;}}

        .option{padding:16px;background:#1a1a1a;border:2px solid #333;border-radius:8px;cursor:pointer;transition:all 0.3s;color:#e6e6e6;}

        .option:hover{border-color:#f6d300;background:#262626;}

        .option.selected{border-color:#f6d300;background:#262626;color:#fff;}

        .option.correct{border-color:#2ecc71;background:#0f261c;color:#b8ffcf;font-weight:bold;}

        .option.incorrect{border-color:#e74c3c;background:#2a0f0f;color:#ffb5b5;font-weight:bold;}

        .explanation{margin-top:15px;padding:15px;background:#111;border-left:4px solid #f6d300;border-radius:6px;display:none;color:#e6e6e6;}

        .explanation-title{color:#f6d300;font-weight:bold;margin-bottom:8px;}

        .controls{display:flex;justify-content:space-between;margin-top:30px;}

        button{padding:12px 28px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;transition:0.3s;}

        #prev-btn{background:#444;color:#fff;}

        #next-btn{background:#f6d300;color:#000;}

        #submit-btn{background:#2ecc71;color:#000;display:none;}

        #new-test-btn{background:#9b59b6;color:#fff;margin-top:20px;}

        .result-container{text-align:center;padding:40px;display:none;}

        .score{font-size:3.6rem;font-weight:bold;color:#f6d300;margin:20px 0;}

        .progress-bar{height:12px;background:#222;border-radius:6px;overflow:hidden;margin:20px 0;}

        .progress{height:100%;width:0%;background:linear-gradient(to right,#f6d300,#fff);transition:width 0.6s;}

        .loading{padding:50px;text-align:center;font-size:1.4rem;}

    </style>

</head>

<body>

    <div class="container">

        <header>

            <h1>Микроэкономика</h1>

            <p class="subtitle">ИК вопросы • Тест для 2 курса</p>

        </header>

        <div class="test-mode">

            <button class="mode-btn active" id="full">Все вопросы</button>

            <button class="mode-btn" id="fifty">50 вопросов</button>

            <button class="mode-btn" id="twentyfive">25 вопросов</button>

        </div>

        <div class="stats">

            <div>Вопрос: <span id="current">1</span>/<span id="total">0</span></div>

            <div>Правильно: <span id="correct">0</span></div>

            <div>Ошибка: <span id="incorrect">0</span></div>

            <div>Без ответа: <span id="unanswered">0</span></div>

        </div>

        <div class="quiz-container" id="quiz">

            <div class="loading">Загрузка всех вопросов...</div>

        </div>

        <div class="result-container" id="result">

            <h2>Тест завершен!</h2>

            <div class="score" id="score">0/0</div>

            <div class="progress-bar"><div class="progress" id="progress"></div></div>

            <h3 id="grade"></h3>

            <button id="new-test-btn">Начать новый тест</button>

        </div>

    </div>

function prepareQuestionsWithRandomOptions(questions) {
    return questions.map(q => {
        const oldCorrectIndex = q.correct;
        const oldOptions = [...q.options];
        const indices = [0,1,2,3];
        for (let i = indices.length-1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i+1));
            [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        const newOptions = indices.map(i => oldOptions[i]);
        const newCorrectIndex = indices.indexOf(oldCorrectIndex);
        return { text: q.text, options: newOptions, correct: newCorrectIndex };
    });
}

    const arr = [...array];
    for(let i = arr.length-1; i > 0; i--){
        const j = Math.floor(Math.random() * (i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

    let count;
    if (mode === 'twentyfive') count = 25;
    else if (mode === 'fifty') count = 50;
    else count = allQuestions.length; // 'full'

    selectedQuestions = shuffleArray([...allQuestions]).slice(0, count);
    answers = Array(selectedQuestions.length).fill(null);
    current = 0;

    document.getElementById('total').textContent = selectedQuestions.length;
    document.getElementById('unanswered').textContent = selectedQuestions.length;
    document.getElementById('correct').textContent = 0;
    document.getElementById('incorrect').textContent = 0;

    quiz.style.display = 'block';
    result.style.display = 'none';
    showQuestion();
}

function showQuestion() {
    const q = selectedQuestions[current];
    let optionsHTML = q.options.map((opt, i) => {
        let cls = 'option';
        if (answers[current] === i) cls += ' selected';
        if (answers[current] !== null) {
            if (i === q.correct) cls += ' correct';
            else if (answers[current] === i) cls += ' incorrect';
        }
        return `<div class="${cls}" onclick="${answers[current]===null ? 'choose('+i+')' : ''}">${String.fromCharCode(65+i)}) ${opt}</div>`;
    }).join('');

    let explanation = answers[current] !== null ?
        `<div class="explanation" style="display:block;">
            <div class="explanation-title">Правильный ответ:</div>
            ${q.options[q.correct]}
         </div>` : '';

    quiz.innerHTML = `
        <div class="question">
            <div class="question-number">Вопрос ${current+1} / ${selectedQuestions.length}</div>
            <div class="question-text">${q.text}</div>
            <div class="options">${optionsHTML}</div>
            ${explanation}
            <div class="controls">
                <button id="prev-btn" ${current===0?'disabled':''} onclick="prev()">Предыдущий</button>
                ${current === selectedQuestions.length-1 ?
                    '<button id="submit-btn" onclick="finish()">Закончить</button>' :
                    '<button id="next-btn" onclick="next()">Следующий</button>'}
            </div>
        </div>`;
    
    document.getElementById('current').textContent = current + 1;
    updateStats();
}

function choose(i) {
    answers[current] = i;
    updateStats();
    showQuestion();
}

function next() { 
    if(current < selectedQuestions.length-1) current++; 
    showQuestion(); 
}

function prev() { 
    if(current > 0) current--; 
    showQuestion(); 
}

function updateStats() {
    const correctCount = answers.filter((a,i) => a !== null && a === selectedQuestions[i].correct).length;
    const answered = answers.filter(a => a !== null).length;
    document.getElementById('correct').textContent = correctCount;
    document.getElementById('incorrect').textContent = answered - correctCount;
    document.getElementById('unanswered').textContent = selectedQuestions.length - answered;
}

function finish() {
    quiz.style.display = 'none';
    result.style.display = 'block';
    const score = answers.filter((a,i) => a !== null && a === selectedQuestions[i].correct).length;
    const percent = Math.round((score / selectedQuestions.length) * 100);
    document.getElementById('score').textContent = `${score}/${selectedQuestions.length}`;
    document.getElementById('progress').style.width = percent + '%';
    document.getElementById('grade').innerHTML = percent >= 90 ? 'Отлично <strong>5</strong>' :
        percent >= 75 ? 'Хорошо <strong>4</strong>' :
        percent >= 60 ? 'Удовлетворительно <strong>3</strong>' : 'Неудовлетворительно <strong>2</strong>';
}

// Button listeners
document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        startTest(this.id);
    });
});

document.getElementById('new-test-btn').onclick = () => startTest(currentMode);

// Start with full test
startTest('full');

</script>
